name: SIGMA - publicar APENAS laboratorio Jarvis (manual)

# This file is intentionally NOT connected to push or pull_request.
# GitHub may require registration on the repository default branch before
# displaying workflow_dispatch. Do not copy it to the default branch blindly.
on:
  workflow_dispatch:
    inputs:
      publish_ack:
        description: "Digite PUBLICAR-APENAS-LAB para confirmar a publicação temporária"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: sigma-jarvis-lab-manual-preview
  cancel-in-progress: false

jobs:
  publish-only-lab:
    if: github.ref == 'refs/heads/sigma-jarvis-arquitetura' && inputs.publish_ack == 'PUBLICAR-APENAS-LAB'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sigma-jarvis-arquitetura
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validar e compilar somente o laboratorio
        run: |
          npm ci
          npm run build:lab
          npm test
          npm run check:worker
          node tests/verify-jarvis-lab-build.mjs
      - name: Reutilizar autenticacao Google Cloud sem chave privada
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/428047765465/locations/global/workloadIdentityPools/sigma-github/providers/github
          service_account: sigma-github-deploy@sigma-61328.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Publicar APENAS canal temporario jarvis-lab, sem tocar no integracao ou prod
        run: npx --yes firebase-tools@latest hosting:channel:deploy jarvis-lab --config firebase.lab.json --project sigma-61328 --expires 2d --non-interactive
