<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#02050f">
  <title>SIGMA — Orbe vivo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Orbitron:wght@500;600&display=swap" rel="stylesheet">

  <!-- =====================================================================
       SIGMA ORB — CSS DO COMPONENTE  (copie este <style> para o seu site)
       ===================================================================== -->
  <style>
    .sigma-stage{
      position:relative; width:100%; height:100vh; height:100dvh; min-height:560px;
      overflow:hidden; background:#02050f; color:#c7d7ff;
      font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
      animation:sigma-fade 1.4s ease-out both;
    }
    @keyframes sigma-fade{from{opacity:0}to{opacity:1}}
    .sigma-stage canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:pan-y;}

    /* área clicável invisível sobre o orbe (acessível por teclado) */
    .sigma-hit{position:absolute; z-index:15; border:0; padding:0; margin:0; border-radius:9999px;
      background:transparent; cursor:pointer; -webkit-tap-highlight-color:transparent; outline:none;}
    .sigma-hit:focus-visible{box-shadow:0 0 0 2px rgba(160,200,255,.75), 0 0 40px rgba(80,140,255,.5);}

    /* legenda abaixo do orbe */
    .sigma-caption{position:absolute; left:0; right:0; z-index:10; text-align:center; padding:0 1rem;
      pointer-events:none; transition:opacity .24s ease, transform .24s ease;}
    .sigma-caption.is-swapping{opacity:0; transform:translateY(8px);}
    .sigma-caption h2{margin:0 0 .55rem; font-weight:300; font-size:clamp(1.35rem,4.6vw,2.25rem);
      letter-spacing:.01em; color:#bfd0ff; text-shadow:0 0 24px rgba(90,150,255,.45);}
    .sigma-caption p{margin:0; padding-left:.42em; font-size:clamp(.62rem,1.7vw,.82rem);
      letter-spacing:.42em; text-transform:uppercase; color:#7b94dc;}

    /* ---- opcionais: cabeçalho e barra de mensagem (remova se já tiver os seus) ---- */
    .sigma-logo{font-family:'Orbitron',sans-serif; font-weight:600; font-size:1.35rem; letter-spacing:.38em;
      color:#a9c4ff; text-shadow:0 0 18px rgba(80,140,255,.55); line-height:1;}
    .sigma-tagline{margin-top:.4rem; font-size:.6rem; letter-spacing:.42em; text-transform:uppercase; color:#6079c0;}
    .sigma-icon-btn{display:inline-flex; align-items:center; justify-content:center; width:2.5rem; height:2.5rem;
      border-radius:9999px; color:#8fb0ff; background:rgba(10,25,60,.45); border:1px solid rgba(120,160,255,.22);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:all .2s; cursor:pointer;}
    .sigma-icon-btn:hover{color:#dbe7ff; border-color:rgba(140,180,255,.5); box-shadow:0 0 18px rgba(60,120,255,.35);}
    .sigma-icon-btn--ghost{background:transparent; border-color:transparent;}
    .sigma-avatar{position:relative; width:2.75rem; height:2.75rem; border-radius:9999px; display:inline-flex;
      align-items:center; justify-content:center; color:#6f9bff; cursor:pointer;
      background:radial-gradient(circle at 50% 35%, rgba(30,70,170,.9), rgba(8,20,50,.95));
      border:1px solid rgba(120,170,255,.45); box-shadow:0 0 22px rgba(60,120,255,.35);}
    .sigma-avatar::after{content:''; position:absolute; right:-1px; bottom:1px; width:.7rem; height:.7rem;
      border-radius:9999px; background:#5ab4ff; border:2px solid #04091c; box-shadow:0 0 8px #5ab4ff;}
    .sigma-form{position:absolute; left:0; right:0; bottom:0; z-index:20; padding:0 1rem calc(1rem + env(safe-area-inset-bottom));}
    @media (min-width:640px){.sigma-form{padding:0 1.5rem calc(1.5rem + env(safe-area-inset-bottom));}}
    .sigma-bar{background:rgba(6,14,38,.55); border:1px solid rgba(100,150,255,.35);
      box-shadow:0 0 30px rgba(40,100,255,.22), inset 0 0 24px rgba(40,100,255,.08);
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);}
    .sigma-round{width:2.5rem; height:2.5rem; border-radius:9999px; color:#bcd0ff; background:rgba(40,80,170,.35);
      border:1px solid rgba(120,170,255,.25); cursor:pointer; flex:none;}
    .sigma-tool{width:2.25rem; height:2.25rem; border-radius:9999px; color:rgba(170,200,255,.75); cursor:pointer; transition:color .2s;}
    .sigma-tool:hover{color:#fff;}
    .sigma-send{width:2.6rem; height:2.6rem; border-radius:9999px; color:#e3edff; background:rgba(25,60,140,.65);
      border:1.5px solid rgba(150,190,255,.85); box-shadow:0 0 18px rgba(80,140,255,.55), inset 0 0 10px rgba(120,170,255,.35);
      cursor:pointer; flex:none; transition:transform .15s;}
    .sigma-send:hover{transform:scale(1.06);}
  </style>

<style id="sigma-preview-layout">
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#02050f;color:#c7d7ff}button,input{font:inherit}button{touch-action:manipulation}
.sigma-stage>header{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:flex-start;justify-content:space-between;padding:22px 20px;gap:8px}
.sigma-stage>header>div{display:flex;align-items:center;gap:12px}.sigma-stage>header>div:first-child{gap:14px}
.sigma-stage>header svg,.sigma-form svg{width:20px;height:20px;display:block}.sigma-stage>header .sigma-avatar svg{width:21px;height:21px}
.sigma-stage>header .h-9{height:36px;width:1px;background:rgba(150,190,255,.25)}
.sigma-stage>header .sigma-avatar{margin-left:4px}
.sigma-bar{display:flex;align-items:center;gap:7px;max-width:672px;margin:0 auto;width:100%;border-radius:999px;padding:6px}
.sigma-bar button{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;padding:0}
.sigma-bar .h-6{width:1px;height:24px;background:rgba(150,190,255,.25);margin:0 4px}
.sigma-bar input{flex:1;min-width:0;background:transparent;color:#d9e7ff;border:0;outline:0;padding:8px 3px;font-size:14px}
.sigma-bar input::placeholder{color:rgba(172,196,255,.55)}
.sigma-bar .sigma-tool{display:none}
.sigma-bar .sigma-tool[aria-label="Áudio"]{display:inline-flex}
.sigma-bar .sigma-send{display:inline-flex}
.sigma-stage .sigma-form{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.preview-note{position:absolute;z-index:25;bottom:calc(5px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#6783b7;font:9px Inter,sans-serif;letter-spacing:.08em;pointer-events:none}
.preview-feedback{position:absolute;z-index:24;left:6%;right:6%;bottom:calc(100px + env(safe-area-inset-bottom));text-align:center;color:#d2e8ff;font:13px Inter,sans-serif;line-height:1.5;text-shadow:0 0 10px #0049b3;pointer-events:none;max-height:90px;overflow:hidden}
.preview-file{position:absolute;z-index:24;left:10%;right:10%;bottom:calc(82px + env(safe-area-inset-bottom));text-align:center;color:#b3d4ff;font:12px Inter,sans-serif;pointer-events:none}
@media(min-width:400px){.sigma-bar .sigma-tool[aria-label="Anexo"]{display:inline-flex}}
@media(min-width:640px){.sigma-stage>header{padding:24px 30px}.sigma-bar .sigma-tool{display:inline-flex}.sigma-stage .sigma-form{padding-bottom:calc(35px + env(safe-area-inset-bottom))}}
@media(max-width:375px){.sigma-stage>header{padding:18px 13px}.sigma-logo{font-size:1.15rem}.sigma-stage>header>div{gap:6px}.sigma-icon-btn{width:34px;height:34px}.sigma-avatar{width:35px;height:35px}}
</style>
<style>
.sigma-stage>header,.sigma-form,.preview-note,.preview-feedback,.preview-file{display:none!important}
.sigma-stage{height:100dvh;min-height:0;animation:none}
.sigma-caption{max-width:100%;pointer-events:none}
</style></head>
<body class="bg-[#02050f]">

<!-- =====================================================================
     SIGMA ORB — HTML DO COMPONENTE  (copie daqui até "FIM DO HTML")
     ===================================================================== -->
<section id="sigmaStage" class="sigma-stage" aria-label="Assistente Sigma">
  <canvas id="sigmaCanvas" aria-hidden="true"></canvas>

  <!-- alvo de toque sobre o orbe (posicionado automaticamente pelo JS) -->
  <button id="sigmaOrbHit" class="sigma-hit" type="button" aria-label="Toque no orbe para iniciar"></button>

  <!-- legenda -->
  <div id="sigmaCaption" class="sigma-caption">
    <h2 id="sigmaTitle">Toque no orbe para iniciar</h2>
    <p id="sigmaSub">Estou à disposição</p>
  </div>

  <!-- (OPCIONAL) Cabeçalho — remova se o seu site já tiver -->
  <header class="absolute inset-x-0 top-0 z-20 flex items-start justify-between px-4 pt-4 sm:px-6 sm:pt-5">
    <div class="flex items-center gap-3 sm:gap-4">
      <button type="button" class="sigma-icon-btn" aria-label="Menu">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="h-9 w-px bg-blue-300/25"></span>
      <div>
        <div class="sigma-logo">SIGMA</div>
        <div class="sigma-tagline">Sempre com você</div>
      </div>
    </div>
    <div class="flex items-center gap-1 sm:gap-2">
      <button type="button" class="sigma-icon-btn sigma-icon-btn--ghost" aria-label="Histórico">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button type="button" class="sigma-icon-btn sigma-icon-btn--ghost" aria-label="Configurações">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button type="button" class="sigma-avatar ml-1" aria-label="Perfil">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8.5" r="4"/><path d="M4 20a8 8 0 0 1 16 0v1H4z"/></svg>
      </button>
    </div>
  </header>

  <!-- (OPCIONAL) Barra de mensagem — remova se o seu site já tiver -->
  <form id="sigmaForm" class="sigma-form" autocomplete="off">
    <div class="sigma-bar mx-auto flex w-full max-w-2xl items-center gap-1 rounded-full p-1.5 sm:gap-2">
      <button type="button" class="sigma-round inline-flex items-center justify-center" aria-label="Adicionar">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <span class="mx-1 h-6 w-px bg-blue-300/20"></span>
      <input type="text" class="min-w-0 flex-1 bg-transparent px-1 text-sm text-blue-100 outline-none placeholder:text-blue-200/45" placeholder="Envie uma mensagem ou arquivo…" aria-label="Mensagem">
      <button type="button" class="sigma-tool inline-flex items-center justify-center" aria-label="Áudio">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg>
      </button>
      <button type="button" class="sigma-tool hidden items-center justify-center sm:inline-flex" aria-label="Câmera">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button type="button" class="sigma-tool hidden items-center justify-center sm:inline-flex" aria-label="Imagem">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9.5" r="1.5"/><path d="m21 16-5-5-9 9"/></svg>
      </button>
      <button type="button" class="sigma-tool hidden items-center justify-center min-[400px]:inline-flex" aria-label="Anexo">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <button type="submit" class="sigma-send inline-flex items-center justify-center" aria-label="Enviar">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>
  <input id="sigmaPreviewFile" type="file" hidden accept="image/*,audio/*,.pdf,.doc,.docx,.txt,.md" multiple>
  <div class="preview-feedback" id="sigmaPreviewFeedback" aria-live="polite"></div>
  <div class="preview-file" id="sigmaPreviewFilename"></div>
  <div class="preview-note">PRÉVIA INTERATIVA · NENHUM DADO É ENVIADO AO SIGMA REAL</div>
</section>
<!-- ============================ FIM DO HTML ============================ -->


<!-- =====================================================================
     SIGMA ORB — JS DO COMPONENTE  (copie este <script> inteiro)
     Expõe window.SigmaOrb = { setState, getState, pulse, setLevel, setText, onTap }
     Estados: 'idle' | 'listening' | 'thinking' | 'speaking'
     ===================================================================== -->
<script src="/sigma-orb.js" defer></script>
<!-- ============================= FIM DO JS ============================= -->


</body></html>
