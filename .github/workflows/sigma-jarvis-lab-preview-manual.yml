name: SIGMA - publicar APENAS laboratorio Jarvis (manual)

# Registered on the default branch so workflow_dispatch is available.
# Never deploys on push, pull_request or any automatic event.
# Compiles the previously verified Jarvis commit, not the production branch.
on:
  workflow_dispatch:
    inputs:
      publish_ack:
        description: "Digite PUBLICAR-APENAS-LAB para confirmar a publicacao temporaria"
        required: true
        type: string
      connect_lab_chat:
        description: "Conectar visualmente chat ao Worker separado? Use somente apos ativacao e teste seguro."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: sigma-jarvis-lab-manual-preview
  cancel-in-progress: false

jobs:
  publish-only-lab:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'felipevieiraribeiro19-a11y' && inputs.publish_ack == 'PUBLICAR-APENAS-LAB' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar somente o commit validado do laboratorio
        uses: actions/checkout@v4
        with:
          ref: 1e67db0671e3dcebfc14d8bdc38004c9587e1174
          persist-credentials: false

      - name: Conferir commit do laboratorio
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "1e67db0671e3dcebfc14d8bdc38004c9587e1174"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validar build isolada antes de autenticar
        env:
          VITE_JARVIS_LAB_API: ${{ inputs.connect_lab_chat && 'https://sigma-jarvis-cerebro-lab.felipevieiraribeiro19.workers.dev' || '' }}
        run: |
          npm ci
          npm run build:lab
          npm test
          npm run check:worker
          node tests/verify-jarvis-lab-build.mjs
          test -f firebase.lab.json
          test -f dist-jarvis-lab/index.html
          test ! -e dist-jarvis-lab/config.json
          test ! -e dist-jarvis-lab/sw.js

      # Existing keyless WIF provider and service account; no new credentials.
      # If the provider rejects workflows on main, this fails closed.
      - name: Autenticar pelo WIF ja existente, sem chave privada
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/428047765465/locations/global/workloadIdentityPools/sigma-github/providers/github
          service_account: sigma-github-deploy@sigma-61328.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true

      # A primeira criacao do canal no Firebase CLI exige uma checagem de
      # Service Usage nao necessaria para atualizar um canal ja existente.
      # Tentar criar somente o canal autorizado via Firebase Hosting REST API,
      # com o mesmo WIF; nao elevar permissoes nem alterar o site live.
      - name: Garantir canal novo jarvis-lab pela API Hosting (sem IAM novo)
        shell: bash
        env:
          LAB_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          node --input-type=module <<'NODE'
          const site='sigma-61328';
          const id='jarvis-lab';
          const base='https://firebasehosting.googleapis.com/v1beta1/sites/'+site+'/channels';
          const token=process.env.LAB_ACCESS_TOKEN;
          if(!token) throw Error('Token WIF ausente; nao publicar');
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          const get=await fetch(base+'/'+id,{headers});
          if(get.status===200){
            const channel=await get.json();
            if(!channel.name?.endsWith('/channels/'+id)) throw Error('Canal inesperado');
            console.log('CANAL_LAB_EXISTENTE');
          } else if(get.status===404){
            const created=await fetch(base+'?channelId='+id,{
              method:'POST',headers,body:JSON.stringify({ttl:'172800s'})
            });
            if(!created.ok) throw Error('Criacao do canal jarvis-lab negada: HTTP '+created.status);
            const channel=await created.json();
            if(!channel.name?.endsWith('/channels/'+id)) throw Error('Criacao de canal inesperado');
            console.log('CANAL_LAB_CRIADO');
          } else {
            throw Error('Consulta do canal jarvis-lab negada: HTTP '+get.status);
          }
          NODE

      - name: Publicar HTML e assets SOMENTE via Firebase Hosting REST no canal jarvis-lab
        shell: bash
        env:
          LAB_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,readdirSync} from 'node:fs';
          import {resolve,join} from 'node:path';
          import {gzipSync} from 'node:zlib';
          import {createHash} from 'node:crypto';

          // The service account can manage Hosting channels, but the Firebase CLI
          // requires serviceusage.services.get. Use the documented Hosting REST API.
          const site='sigma-61328';
          const channelId='jarvis-lab';
          const host='https://firebasehosting.googleapis.com/v1beta1';
          const token=process.env.LAB_ACCESS_TOKEN;
          if(!token) throw Error('Sem token WIF; publicacao bloqueada');

          const cfg=JSON.parse(readFileSync('firebase.lab.json','utf8')).hosting;
          if(cfg.public!=='dist-jarvis-lab' ||
             cfg.rewrites?.length!==1 ||
             cfg.rewrites[0].source!=='**' ||
             cfg.rewrites[0].destination!=='/index.html' ||
             cfg.headers?.length!==1 ||
             cfg.headers[0].source!=='**') {
            throw Error('Configuracao do laboratorio inesperada');
          }
          const headers=Object.fromEntries(cfg.headers[0].headers.map(h=>[h.key,h.value]));
          if(headers['Cache-Control']!=='no-store' ||
             !headers['Content-Security-Policy']?.includes("default-src 'none'") ||
             headers['X-Robots-Tag']!=='noindex, nofollow, noarchive') {
            throw Error('Cabecalhos de seguranca ausentes');
          }

          const dir=resolve(cfg.public);
          const entries=[
            ...readdirSync(dir,{withFileTypes:true}).filter(e=>e.isFile()).map(e=>e.name),
            ...readdirSync(join(dir,'assets'),{withFileTypes:true}).filter(e=>e.isFile()).map(e=>'assets/'+e.name)
          ].sort();
          if(entries.length!==3 || !entries.includes('index.html') ||
             entries.filter(x=>/^assets\/[\w.-]+\.js$/.test(x)).length!==1 ||
             entries.filter(x=>/^assets\/[\w.-]+\.css$/.test(x)).length!==1) {
            throw Error('Build nao contem apenas index.html, JS e CSS do laboratorio');
          }
          const fileHashes={};
          const zipped=new Map();
          for(const file of entries) {
            const compressed=gzipSync(readFileSync(join(dir,file)));
            const hash=createHash('sha256').update(compressed).digest('hex');
            fileHashes['/'+file]=hash;
            zipped.set(hash,compressed);
          }

          const authHeaders={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          async function api(url,method='GET',body) {
            if(!url.startsWith(host+'/sites/'+site+'/')) throw Error('API fora do site permitido');
            const r=await fetch(url,{
              method,headers:authHeaders,
              ...(body===undefined?{}:{body:JSON.stringify(body)})
            });
            if(!r.ok) throw Error('Firebase Hosting API '+method+' retornou HTTP '+r.status);
            return await r.json();
          }

          const channelName='sites/'+site+'/channels/'+channelId;
          const channel=await api(host+'/'+channelName);
          if(channel.name!==channelName ||
             !channel.url?.startsWith('https://') ||
             !channel.url.endsWith('.web.app')) {
            throw Error('Canal ou URL inesperados, publicacao bloqueada');
          }
          const version=await api(host+'/sites/'+site+'/versions','POST',{
            config:{
              rewrites:[{glob:'**',path:'/index.html'}],
              headers:[{glob:'**',headers}]
            }
          });
          if(!/^sites\/sigma-61328\/versions\/[A-Za-z0-9_-]+$/.test(version.name||'')) {
            throw Error('Versao retornada fora do site autorizado');
          }
          const url=host+'/'+version.name;
          const populated=await api(url+':populateFiles','POST',{files:fileHashes});
          const expectedUpload='https://upload-firebasehosting.googleapis.com/upload/'+version.name+'/files';
          if(populated.uploadUrl!==expectedUpload ||
             !Array.isArray(populated.uploadRequiredHashes)) {
            throw Error('Destino de upload inesperado');
          }
          for(const hash of populated.uploadRequiredHashes) {
            if(!zipped.has(hash)) throw Error('Hash requerido desconhecido');
            const response=await fetch(populated.uploadUrl+'/'+hash,{
              method:'POST',
              headers:{Authorization:'Bearer '+token,'Content-Type':'application/octet-stream'},
              body:zipped.get(hash)
            });
            if(!response.ok) throw Error('Upload de asset negado: HTTP '+response.status);
          }
          const finalized=await api(url+'?update_mask=status','PATCH',{status:'FINALIZED'});
          if(finalized.status!=='FINALIZED') throw Error('Versao nao finalizada');

          // Only releases for the named preview channel; never /sites/{id}/releases.
          const release=await api(host+'/'+channelName+'/releases?versionName='+encodeURIComponent(version.name),'POST',{});
          if(!release.name?.startsWith(channelName+'/releases/') ||
             release.version?.name!==version.name) {
            throw Error('Resposta de release nao confirma canal e versao');
          }
          const confirmed=await api(host+'/'+channelName);
          if(confirmed.url!==channel.url) throw Error('URL do canal mudou inesperadamente');
          console.log('JARVIS_LAB_RELEASE_CONFIRMED');
          console.log('JARVIS_LAB_URL='+confirmed.url);
          console.log('JARVIS_LAB_EXPIRES='+String(confirmed.expireTime||'nao informado'));
          NODE
