name: SIGMA - publicar site definitivo

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sigma-firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/sigma-work-integracao'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias e validar
        run: |
          npm ci
          npm run build
          npm test
          npm run check:worker
      - name: Autenticar no Google Cloud com identidade federada
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/428047765465/locations/global/workloadIdentityPools/sigma-github/providers/github
          service_account: sigma-github-deploy@sigma-61328.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Publicar somente Firebase Hosting definitivo do SIGMA
        run: npx --yes firebase-tools@latest deploy --only hosting --project sigma-61328 --non-interactive
