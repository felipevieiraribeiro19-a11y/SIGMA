name: SIGMA - publicar canal de testes

on:
  workflow_dispatch:
  push:
    branches: [sigma-work-integracao]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'tsconfig.json'
      - 'firebase.json'
      - '.github/workflows/sigma-preview.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: sigma-firebase-preview
  cancel-in-progress: false

jobs:
  test-and-preview:
    if: github.ref == 'refs/heads/sigma-work-integracao'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar interface e testes
        run: |
          npm run build
          npm test
          npm run check:worker
      - name: Autenticar com Google Cloud sem chave privada
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/428047765465/locations/global/workloadIdentityPools/sigma-github/providers/github
          service_account: sigma-github-deploy@sigma-61328.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Publicar somente no canal de testes integracao
        run: npx --yes firebase-tools@latest hosting:channel:deploy integracao --project sigma-61328 --expires 7d --non-interactive
