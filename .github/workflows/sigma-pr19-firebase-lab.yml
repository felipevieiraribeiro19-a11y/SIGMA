name: SIGMA LAB PR19 - Publicacao Firebase autorizada

# Autorizado em 24/10/2026. Exclusivamente o canal jarvis-lab.
# Adicionar este arquivo na branch sigma-consultar-concluir-tarefas-chat.
on:
  pull_request:
    branches: [sigma-chat-tarefas-confirmadas]
    types: [synchronize]
    paths:
      - '.github/workflows/sigma-pr19-firebase-lab.yml'

permissions:
  contents: read

concurrency:
  group: sigma-pr19-firebase-lab-unico
  cancel-in-progress: false

jobs:
  validar:
    if: >-
      github.event.pull_request.number == 19 &&
      github.head_ref == 'sigma-consultar-concluir-tarefas-chat' &&
      github.base_ref == 'sigma-chat-tarefas-confirmadas' &&
      github.event.pull_request.head.repo.full_name == 'felipevieiraribeiro19-a11y/SIGMA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_JARVIS_LAB_API: https://sigma-jarvis-cerebro-lab.felipevieiraribeiro19.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verificar compilacao e testes
        run: |
          npm run build:lab
          npm run check:worker
          npm test
          node tests/verify-jarvis-lab-build.mjs
          node scripts/sigma-lab-preflight.mjs

  publicar-apenas-lab:
    needs: [validar]
    if: >-
      github.event.pull_request.number == 19 &&
      github.head_ref == 'sigma-consultar-concluir-tarefas-chat' &&
      github.base_ref == 'sigma-chat-tarefas-confirmadas' &&
      github.event.pull_request.head.repo.full_name == 'felipevieiraribeiro19-a11y/SIGMA'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VITE_JARVIS_LAB_API: https://sigma-jarvis-cerebro-lab.felipevieiraribeiro19.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preparar somente o LAB
        run: |
          npm run build:lab
          node tests/verify-jarvis-lab-build.mjs
          node scripts/sigma-lab-preflight.mjs
      - name: Reutilizar autenticacao federada Google existente
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/428047765465/locations/global/workloadIdentityPools/sigma-github/providers/github
          service_account: sigma-github-deploy@sigma-61328.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Publicar EXCLUSIVAMENTE Firebase LAB no canal jarvis-lab
        run: npx --yes firebase-tools@15.34.0 hosting:channel:deploy jarvis-lab --config firebase.lab.json --project sigma-61328 --expires 30d --non-interactive
