# SIGMA - consolidacao tecnica, SEM deploy e SEM credenciais
# Executa somente para a branch de revisao consolidada; evita consumir Work.
name: SIGMA - verificacao consolidada do laboratorio

on:
  push:
    branches:
      - sigma-lab-consolidacao-segura
      - sigma-lab-preflight-etapa11
  pull_request:
    branches:
      - sigma-ecossistema-integracoes
      - sigma-lab-consolidacao-segura
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sigma-consolidacao-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codigo-e-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Public, lab-only endpoint: not a secret. Required to test the actual bundle.
      VITE_JARVIS_LAB_API: https://sigma-jarvis-cerebro-lab.felipevieiraribeiro19.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias travadas
        run: npm ci
      - name: Compilar interface principal (sem publicar)
        run: npm run build
      - name: Compilar interface Jarvis LAB (sem publicar)
        run: npm run build:lab
      - name: Validar TypeScript do Worker
        run: npm run check:worker
      - name: Executar todos os testes
        run: npm test
      - name: Auditar build estatico e isolado do laboratorio
        run: |
          node tests/verify-jarvis-lab-build.mjs
          node scripts/sigma-lab-preflight.mjs
      - name: Salvar pacote estatico para revisao privada (sem publicar)
        uses: actions/upload-artifact@v4
        with:
          name: sigma-lab-build-revisao
          path: dist-jarvis-lab/
          retention-days: 5
          if-no-files-found: error

  chat-cloudflare-local:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias travadas
        run: npm ci
      - name: Iniciar Worker em workerd local e verificar bloqueios
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: bash tests/run-jarvis-chat-offline.sh

  durabilidade-cloudflare-local:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias travadas
        run: npm ci
      - name: Persistencia e recuperacao em Durable Object local
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: bash tests/run-cloudflare-offline-lab.sh

  dependencias-somente-relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Coletar avisos do registro npm sem alterar arquivos
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit.json || true
          node scripts/sigma-npm-audit-report.mjs reports/npm-audit.json reports/sigma-npm-audit.md
      - name: Anexar relatorio ao GitHub privado, sem publicar
        uses: actions/upload-artifact@v4
        with:
          name: sigma-lab-auditoria-npm
          path: reports/sigma-npm-audit.md
          retention-days: 5
          if-no-files-found: error

  bundle-cerebro-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compilar cérebro SIGMA LAB em um arquivo para atualização via Cloudflare conectado
        run: |
          mkdir -p dist-worker-lab
          ./node_modules/.bin/esbuild worker/src/chat-lab.ts --bundle --platform=browser --format=esm --target=es2022 --outfile=dist-worker-lab/worker.mjs
          test -s dist-worker-lab/worker.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sigma-worker-lab-bundle
          path: dist-worker-lab/worker.mjs
          retention-days: 2
          if-no-files-found: error
      - name: Salvar bundle revisável somente na branch de LAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/sigma-lab-preflight-etapa11'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist-worker-lab/worker.mjs
          git commit -m "build(lab): bundle temporário para atualizar Worker via conector"
          git push origin HEAD:sigma-lab-preflight-etapa11

  firebase-lab-deploy-autorizado:
    # Autorização explícita do proprietário: laboratório apenas; não produção.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 17 && github.head_ref == 'sigma-lab-preflight-etapa11' && github.base_ref == 'sigma-lab-consolidacao-segura' && github.event.pull_request.head.repo.full_name == 'felipevieiraribeiro19-a11y/SIGMA'
    needs: [codigo-e-interface]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VITE_JARVIS_LAB_API: https://sigma-jarvis-cerebro-lab.felipevieiraribeiro19.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compilar e verificar site exclusivo do laboratório
        run: |
          npm run build:lab
          node tests/verify-jarvis-lab-build.mjs
          node scripts/sigma-lab-preflight.mjs
      - name: Reutilizar identidade federada sem chave privada
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/428047765465/locations/global/workloadIdentityPools/sigma-github/providers/github
          service_account: sigma-github-deploy@sigma-61328.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Publicar APENAS canal jarvis-lab
        run: npx --yes firebase-tools@latest hosting:channel:deploy jarvis-lab --config firebase.lab.json --project sigma-61328 --expires 30d --non-interactive
