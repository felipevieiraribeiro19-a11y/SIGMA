name: SIGMA LAB - deploy isolado autorizado em conversa

# Autorizacao do dono em 2026-10-23: somente LAB, preservar dados e credenciais.
# Unica execucao por adicao deste workflow na branch LAB.
on:
  push:
    branches: [sigma-lab-preflight-etapa11]
    paths: ['.github/workflows/sigma-lab-publicar-autorizado.yml']

permissions:
  contents: read
  id-token: write

concurrency:
  group: sigma-jarvis-lab-deploy-exclusivo
  cancel-in-progress: false

jobs:
  firebase-lab:
    if: github.ref == 'refs/heads/sigma-lab-preflight-etapa11'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_JARVIS_LAB_API: https://sigma-jarvis-cerebro-lab.felipevieiraribeiro19.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias travadas
        run: npm ci
      - name: Build LAB, validacao e preflight
        run: |
          npm run build:lab
          npm run check:worker
          npm test
          node tests/verify-jarvis-lab-build.mjs
          node scripts/sigma-lab-preflight.mjs
      - name: Reutilizar WIF existente, sem chave privada
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/428047765465/locations/global/workloadIdentityPools/sigma-github/providers/github
          service_account: sigma-github-deploy@sigma-61328.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Publicar SOMENTE Firebase Hosting canal jarvis-lab
        run: npx --yes firebase-tools@latest hosting:channel:deploy jarvis-lab --config firebase.lab.json --project sigma-61328 --expires 30d --non-interactive

  bundle-worker-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias travadas
        run: npm ci
      - name: Compilar Worker LAB sem publicar e sem segredos
        run: |
          mkdir -p dist-worker-lab
          ./node_modules/.bin/esbuild worker/src/chat-lab.ts --bundle --platform=browser --format=esm --target=es2022 --outfile=dist-worker-lab/worker.mjs
          test -s dist-worker-lab/worker.mjs
          if grep -q 'sigma-cerebro.felipevieiraribeiro19.workers.dev' dist-worker-lab/worker.mjs; then
            echo 'Origem de producao detectada'; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sigma-lab-worker-bundle-autorizado
          path: dist-worker-lab/worker.mjs
          retention-days: 2
          if-no-files-found: error
