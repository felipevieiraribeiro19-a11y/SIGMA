name: SIGMA - validar regras de memoria isoladas
on:
  workflow_dispatch:
  push:
    branches: [sigma-jarvis-arquitetura]
    paths:
      - 'firestore.memory.rules.candidate'
      - 'firebase.memory.test.json'
      - 'tests/firebase-memory.rules.test.mjs'
      - '.github/workflows/sigma-memory-emulator.yml'

permissions:
  contents: read

jobs:
  memory-security:
    if: github.ref == 'refs/heads/sigma-jarvis-arquitetura'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias do projeto
        run: npm ci
      - name: Instalar ferramenta de testes de regras (somente no runner)
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5
      - name: Validar app e testes sem dados pessoais
        run: |
          npm run build
          npm run check:worker
          npm test
      - name: Rodar emulador Firestore local - PROIBIDO publicar regras
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: npx --yes firebase-tools@latest emulators:exec --project sigma-jarvis-memory-test --config firebase.memory.test.json --only firestore 'node tests/firebase-memory.rules.test.mjs'
