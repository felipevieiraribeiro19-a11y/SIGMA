name: SIGMA LAB PR19 - validar pacotes sem publicar

# Never deploy from this workflow. Branch-specific preflight only.
on:
  push:
    branches: [sigma-consultar-concluir-tarefas-chat]
  pull_request:
    branches: [sigma-chat-tarefas-confirmadas]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-lab-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_JARVIS_LAB_API: https://sigma-jarvis-cerebro-lab.felipevieiraribeiro19.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias fixadas
        run: npm ci
      - name: Testar frontend e Worker, sem rede externa
        run: |
          npm run build:lab
          npm run check:worker
          npm test
          node tests/verify-jarvis-lab-build.mjs
          node scripts/sigma-lab-preflight.mjs
      - name: Gerar bundle do Worker LAB sem publicar
        run: |
          mkdir -p dist-worker-lab
          ./node_modules/.bin/esbuild worker/src/chat-lab.ts --bundle --platform=browser --format=esm --target=es2022 --outfile=dist-worker-lab/worker.mjs
          test -s dist-worker-lab/worker.mjs
          if grep -q 'sigma-cerebro.felipevieiraribeiro19.workers.dev' dist-worker-lab/worker.mjs; then
            echo 'Worker principal no bundle LAB'; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sigma-pr19-lab-review-only
          path: |
            dist-jarvis-lab/
            dist-worker-lab/worker.mjs
          retention-days: 3
          if-no-files-found: error
