name: SIGMA - laboratorio Cloudflare offline

on:
  push:
    branches: [sigma-ecossistema-integracoes]
  workflow_dispatch:
  pull_request:
    branches: [sigma-work-integracao]
    paths:
      - 'worker/src/offline-approval-lab.ts'
      - 'worker/src/chat-lab.ts'
      - 'worker/wrangler.chat-lab.toml'
      - 'tests/run-jarvis-chat-offline.sh'
      - 'tests/chat-lab-http.mjs'
      - 'worker/src/core/audited-approval.ts'
      - 'worker/src/core/offline-mock-store.ts'
      - 'worker/src/core/mock-executor.ts'
      - 'worker/src/core/action-flow.ts'
      - 'worker/src/core/approval-ledger.ts'
      - 'worker/wrangler.offline-lab.toml'
      - 'tests/cloudflare-offline-lab.mjs'
      - 'tests/run-cloudflare-offline-lab.sh'
      - '.github/workflows/sigma-cloudflare-lab.yml'

permissions:
  contents: read

jobs:
  real-local-cloudflare-runtime:
    if: github.head_ref == 'sigma-jarvis-arquitetura' || github.ref == 'refs/heads/sigma-ecossistema-integracoes'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project packages
        run: npm ci
      - name: Verify TypeScript and unit tests
        run: |
          npm run check:worker
          npm test
      - name: Verify offline Cloudflare Workers runtime and restart persistence
        env:
          CI: "true"
          CLOUDFLARE_ACCOUNT_ID: ""
          CLOUDFLARE_API_TOKEN: ""
        run: bash tests/run-cloudflare-offline-lab.sh


  chat-lab-http:
    if: github.head_ref == 'sigma-jarvis-arquitetura' || github.ref == 'refs/heads/sigma-ecossistema-integracoes'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies for isolated lab
        run: npm ci
      - name: Start isolated chat Worker in local workerd; confirm fail closed
        env:
          CI: "true"
          CLOUDFLARE_ACCOUNT_ID: ""
          CLOUDFLARE_API_TOKEN: ""
        run: bash tests/run-jarvis-chat-offline.sh
