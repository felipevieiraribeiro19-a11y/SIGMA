name: SIGMA - publicar cerebro no Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sigma-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/sigma-work-integracao'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar e validar
        run: |
          npm ci
          npm test
          npm run check:worker
      - name: Publicar Worker existente sigma-cerebro
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ffbf8770e586438ce53536e3bf0f5d65
          workingDirectory: worker
          command: deploy --keep-vars
