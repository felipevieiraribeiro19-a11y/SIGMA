name: SIGMA - validar laboratorio Jarvis isolado

on:
  pull_request:
    branches: [sigma-work-integracao]
    paths:
      - 'src/jarvis-lab*'
      - 'src/ActionReviewCenter.tsx'
      - 'src/MemoryCenter.tsx'
      - 'src/memory-demo.ts'
      - 'jarvis-lab.html'
      - 'vite.lab.config.ts'
      - 'firebase.lab.json'
      - 'package.json'
      - 'tests/jarvis-lab-ui.test.ts'
      - 'tests/verify-jarvis-lab-build.mjs'
      - '.github/workflows/sigma-jarvis-lab-build.yml'

permissions:
  contents: read

jobs:
  build-mobile-lab:
    if: github.head_ref == 'sigma-jarvis-arquitetura'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar pacotes
        run: npm ci
      - name: Validar frontend e testes de isolamento
        run: |
          npm run build:lab
          npm test
          npm run check:worker
          node tests/verify-jarvis-lab-build.mjs
      - name: Salvar somente os arquivos estaticos do laboratorio (sem deploy)
        uses: actions/upload-artifact@v4
        with:
          name: sigma-jarvis-lab-estatico
          path: dist-jarvis-lab/
          retention-days: 5
          if-no-files-found: error
