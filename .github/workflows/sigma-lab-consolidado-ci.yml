# SIGMA - consolidacao tecnica, SEM deploy e SEM credenciais
# Executa somente para a branch de revisao consolidada; evita consumir Work.
name: SIGMA - verificacao consolidada do laboratorio

on:
  push:
    branches:
      - sigma-lab-consolidacao-segura
  pull_request:
    branches:
      - sigma-ecossistema-integracoes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sigma-consolidacao-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codigo-e-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Public, lab-only endpoint: not a secret. Required to test the actual bundle.
      VITE_JARVIS_LAB_API: https://sigma-jarvis-cerebro-lab.felipevieiraribeiro19.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias travadas
        run: npm ci
      - name: Compilar interface principal (sem publicar)
        run: npm run build
      - name: Compilar interface Jarvis LAB (sem publicar)
        run: npm run build:lab
      - name: Validar TypeScript do Worker
        run: npm run check:worker
      - name: Executar todos os testes
        run: npm test
      - name: Auditar build estatico e isolado do laboratorio
        run: |
          node tests/verify-jarvis-lab-build.mjs
          node scripts/sigma-lab-preflight.mjs
      - name: Salvar pacote estatico para revisao privada (sem publicar)
        uses: actions/upload-artifact@v4
        with:
          name: sigma-lab-build-revisao
          path: dist-jarvis-lab/
          retention-days: 5
          if-no-files-found: error

  chat-cloudflare-local:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias travadas
        run: npm ci
      - name: Iniciar Worker em workerd local e verificar bloqueios
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: bash tests/run-jarvis-chat-offline.sh

  durabilidade-cloudflare-local:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias travadas
        run: npm ci
      - name: Persistencia e recuperacao em Durable Object local
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: bash tests/run-cloudflare-offline-lab.sh

  dependencias-somente-relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Coletar avisos do registro npm sem alterar arquivos
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit.json || true
          node scripts/sigma-npm-audit-report.mjs reports/npm-audit.json reports/sigma-npm-audit.md
      - name: Anexar relatorio ao GitHub privado, sem publicar
        uses: actions/upload-artifact@v4
        with:
          name: sigma-lab-auditoria-npm
          path: reports/sigma-npm-audit.md
          retention-days: 5
          if-no-files-found: error
