name: SIGMA LAB PR19 - pacote Worker autorizado (sem deploy)

# Autorização do proprietário em 24/10/2026: SOMENTE SIGMA LAB.
# Evento disparado uma vez pela adição deste arquivo; não altera segredos nem produção.
on:
  push:
    branches: [sigma-consultar-concluir-tarefas-chat]
    paths: ['.github/workflows/sigma-pr19-worker-bundle-authorized.yml']

permissions:
  contents: read

concurrency:
  group: sigma-pr19-worker-bundle-once
  cancel-in-progress: false

jobs:
  create-reviewable-lab-bundle:
    if: github.ref == 'refs/heads/sigma-consultar-concluir-tarefas-chat'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VITE_JARVIS_LAB_API: https://sigma-jarvis-cerebro-lab.felipevieiraribeiro19.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validar código do LAB antes de produzir bundle
        run: |
          npm run build:lab
          npm run check:worker
          npm test
          node tests/verify-jarvis-lab-build.mjs
          node scripts/sigma-lab-preflight.mjs
      - name: Compilar exclusivamente Worker LAB
        run: |
          mkdir -p dist-worker-lab
          ./node_modules/.bin/esbuild worker/src/chat-lab.ts --bundle --platform=browser --format=esm --target=es2022 --outfile=dist-worker-lab/worker.mjs
          test -s dist-worker-lab/worker.mjs
          ! grep -q 'sigma-cerebro.felipevieiraribeiro19.workers.dev' dist-worker-lab/worker.mjs
      - name: Salvar bundle revisável na branch PR19 (não publicar)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist-worker-lab/worker.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build(lab): bundle PR19 autorizado para upload seguro pelo conector Cloudflare"
            git push origin HEAD:sigma-consultar-concluir-tarefas-chat
          fi
