# ETAPA 14: Worker novo e INDEPENDENTE, não é o sigma-cerebro.
# NÃO publicar antes de configurar origem exata, UID e secret Gemini.
name = "sigma-jarvis-cerebro-lab"
main = "src/chat-lab.ts"
compatibility_date = "2026-10-01"

[vars]
FIREBASE_PROJECT_ID = "sigma-61328"
# URL REAL confirmada no Hosting, sem a barra final. Atualizar caso o canal mude.
ALLOWED_ORIGIN = "https://sigma-61328--jarvis-lab-pw5dmfbc.web.app"
GEMINI_MODEL = "gemini-3.5-flash-lite"
LAB_CHAT_ENABLED = "false"
# Etapa 15: pesquisa paga/em cotas somente com habilitação explícita.
LAB_WEB_ENABLED = "false"
# Etapa 16: memória manual, isolada, não habilitada em produção.
LAB_MEMORY_ENABLED = "false"
# 16C: recall is optional and only under per-session user consent.
LAB_MEMORY_AUTO_ENABLED = "false"
# Ecosystem LAB: no production Firestore, secrets only on Cloudflare.
LAB_WORKSPACE_ENABLED = "false"
LAB_CONNECTORS_ENABLED = "false"
LAB_ACTIONS_ENABLED = "false"
LAB_DOCUMENTS_ENABLED = "false"

# ALLOWED_UID e GEMINI_API_KEY devem ser segredos do Worker de laboratório.
# Nunca colocar os valores neste arquivo nem no GitHub.
[[durable_objects.bindings]]
name = "LAB_QUOTA"
class_name = "LabChatQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LabChatQuota"]

# Store separately from chat quota and SIGMA production. No Firestore access.
[[durable_objects.bindings]]
name = "LAB_MEMORY"
class_name = "LabMemoryStore"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LabMemoryStore"]

[[durable_objects.bindings]]
name = "LAB_WORKSPACE"
class_name = "LabWorkspaceStore"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["LabWorkspaceStore"]

[[durable_objects.bindings]]
name = "LAB_ACTIONS"
class_name = "LabExternalActionStore"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["LabExternalActionStore"]

[[durable_objects.bindings]]
name = "LAB_DOCUMENT_INDEX"
class_name = "LabDocumentIndex"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["LabDocumentIndex"]
