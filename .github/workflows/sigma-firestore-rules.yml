name: SIGMA - publicar regras do Firestore

# Publica SOMENTE firestore.rules. Não toca em hosting, Worker, dados ou credenciais.
# Execução manual e deliberada: o arquivo de regras é um protótipo e aplicar uma
# alteração errada pode bloquear a leitura/gravação do aplicativo em produção.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite PUBLICAR para confirmar a aplicação das regras em sigma-61328'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: sigma-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/sigma-work-integracao' && inputs.confirmar == 'PUBLICAR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validar projeto antes de tocar em produção
        run: |
          npm ci
          npm run build
          npm test
          npm run check:worker
      - name: Autenticar no Google Cloud com identidade federada
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/428047765465/locations/global/workloadIdentityPools/sigma-github/providers/github
          service_account: sigma-github-deploy@sigma-61328.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Publicar apenas firestore.rules
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project sigma-61328 --non-interactive
