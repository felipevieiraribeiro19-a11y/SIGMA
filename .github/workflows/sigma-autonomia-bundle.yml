name: SIGMA Autonomia - pacote Worker validado (sem deploy)
on:
  push:
    branches: [sigma-automacao-tarefas-20261025]
    paths: ['.github/workflows/sigma-autonomia-bundle.yml']
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verificar Beta, Worker e testes de comandos
        env:
          VITE_SIGMA_BETA: 'true'
        run: |
          npm run build:beta
          npm run check:worker
          npm test
      - name: Gerar apenas bundle do Worker LAB
        run: |
          mkdir -p dist-worker-lab
          ./node_modules/.bin/esbuild worker/src/chat-lab.ts --bundle --platform=browser --format=esm --target=es2022 --outfile=dist-worker-lab/worker.mjs
          test -s dist-worker-lab/worker.mjs
          grep -q 'task-replays' dist-worker-lab/worker.mjs
      - name: Salvar artefato compilado na branch, sem implantar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist-worker-lab/worker.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build(sigma): bundle da autonomia de tarefas validado"
            git push origin HEAD:sigma-automacao-tarefas-20261025
          fi
